name: Discord Notifications

on:
  workflow_run:
    workflows: ["CI", "Frontend CI", "Backend CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get workflow status
        id: workflow-status
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "${{ github.event.workflow_run.name }} - ${{ steps.workflow-status.outputs.status }}"
          description: |
            **Workflow:** ${{ github.event.workflow_run.name }}
            **Status:** ${{ steps.workflow-status.outputs.emoji }} ${{ steps.workflow-status.outputs.status }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** ${{ github.event.workflow_run.head_commit.message }}
            **Author:** ${{ github.event.workflow_run.head_commit.author.name }}
          color: ${{ steps.workflow-status.outputs.color }}
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

      # Alternative: Simple webhook using curl (if the action above doesn't work)
      # - name: Send Discord webhook
      #   run: |
      #     curl -H "Content-Type: application/json" \
      #          -d '{
      #            "embeds": [{
      #              "title": "${{ github.event.workflow_run.name }} - ${{ steps.workflow-status.outputs.status }}",
      #              "description": "**Branch:** ${{ github.event.workflow_run.head_branch }\n**Status:** ${{ steps.workflow-status.outputs.emoji }} ${{ steps.workflow-status.outputs.status }}",
      #              "color": ${{ steps.workflow-status.outputs.color }},
      #              "timestamp": "${{ github.event.workflow_run.updated_at }}"
      #            }]
      #          }' \
      #          ${{ secrets.DISCORD_WEBHOOK_URL }}

