name: Discord Notify

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check Discord webhook secret
        id: check-secret
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "secret_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "secret_exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Discord payload
        id: payload
        if: steps.check-secret.outputs.secret_exists == 'true'
        run: |
          STATUS="${{ github.event.workflow_run.conclusion }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          WORKFLOW_URL="${{ github.event.workflow_run.html_url }}"
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          COMMIT_MSG="${{ github.event.workflow_run.head_commit.message }}"
          AUTHOR="${{ github.event.workflow_run.head_commit.author.name }}"

          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
          else
            COLOR=15158332
          fi

          # Ensure jq is available
          if ! command -v jq >/dev/null; then
            echo "jq not found, installing..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

          DESCRIPTION=$(printf "**Repository:** %s\n**Branch:** %s\n**Status:** %s %s\n**Commit:** %s\n**Author:** %s" "$REPO" "$BRANCH" "$STATUS" "$STATUS" "$COMMIT_MSG" "$AUTHOR")

          jq -n --arg username "GitHub Actions" \
            --arg avatar_url "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" \
            --arg title "${WORKFLOW_NAME} - ${STATUS}" \
            --arg description "$DESCRIPTION" \
            --arg url "$WORKFLOW_URL" \
            --arg timestamp "$TIMESTAMP" \
            --argjson color "$COLOR" \
            '{username:$username, avatar_url:$avatar_url, embeds:[{title:$title, description:$description, color:$color, timestamp:$timestamp, url:$url, footer:{text:"GitHub Actions"}}]}' > payload.json

          echo "payload_file=payload.json" >> "$GITHUB_OUTPUT"
          echo "Created payload.json ($(wc -c < payload.json) bytes)"

      - name: Send notification to Discord
        if: steps.check-secret.outputs.secret_exists == 'true'
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data @"${{ steps.payload.outputs.payload_file }}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Debug workflow info
        run: |
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Secret exists: ${{ steps.check-secret.outputs.secret_exists }}"
