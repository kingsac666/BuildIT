name: Discord Notifications

on:
  workflow_run:
    workflows: ["CI", "Frontend CI", "Backend CI", "Development Checks"]
    types:
      - completed
  workflow_dispatch:

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get workflow status
        id: workflow-status
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          echo "Workflow conclusion: $CONCLUSION"
          
          if [ "$CONCLUSION" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT
          elif [ "$CONCLUSION" == "failure" ] || [ "$CONCLUSION" == "cancelled" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT
          else
            echo "status=$CONCLUSION" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "color=16776960" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Discord payload
        id: payload
        run: |
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          STATUS="${{ steps.workflow-status.outputs.status }}"
          EMOJI="${{ steps.workflow-status.outputs.emoji }}"
          COLOR="${{ steps.workflow-status.outputs.color }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          COMMIT_MSG="${{ github.event.workflow_run.head_commit.message }}"
          AUTHOR="${{ github.event.workflow_run.head_commit.author.name }}"
          WORKFLOW_URL="${{ github.event.workflow_run.html_url }}"
          REPO="${{ github.repository }}"
          TIMESTAMP="${{ github.event.workflow_run.updated_at }}"
          
          # Simple JSON escaping function
          escape_json() {
            echo "$1" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/\r/\\r/g' | sed 's/\t/\\t/g'
          }
          
          COMMIT_MSG_ESCAPED=$(escape_json "$COMMIT_MSG")
          WORKFLOW_NAME_ESCAPED=$(escape_json "$WORKFLOW_NAME")
          AUTHOR_ESCAPED=$(escape_json "$AUTHOR")
          BRANCH_ESCAPED=$(escape_json "$BRANCH")
          REPO_ESCAPED=$(escape_json "$REPO")
          
          # Build JSON payload manually with proper escaping
          PAYLOAD=$(cat <<PAYLOAD_EOF
          {
            "username": "GitHub Actions",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "${WORKFLOW_NAME_ESCAPED} - ${STATUS}",
              "description": "**Repository:** ${REPO_ESCAPED}\\n**Branch:** ${BRANCH_ESCAPED}\\n**Status:** ${EMOJI} ${STATUS}\\n**Commit:** ${COMMIT_MSG_ESCAPED}\\n**Author:** ${AUTHOR_ESCAPED}",
              "color": ${COLOR},
              "timestamp": "${TIMESTAMP}",
              "url": "${WORKFLOW_URL}",
              "footer": {
                "text": "GitHub Actions"
              }
            }]
          }
          PAYLOAD_EOF
          )
          
          echo "payload<<EOF" >> $GITHUB_OUTPUT
          echo "$PAYLOAD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Payload created successfully"
          echo "Workflow: $WORKFLOW_NAME"
          echo "Status: $STATUS"

      - name: Check Discord webhook secret
        id: check-secret
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL secret is not set!"
            echo ""
            echo "To enable Discord notifications:"
            echo "1. Go to: Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: DISCORD_WEBHOOK_URL"
            echo "4. Value: Your Discord webhook URL"
            echo ""
            echo "secret_exists=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "✅ Discord webhook secret is configured"
            echo "secret_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Debug workflow info
        run: |
          echo "=== Workflow Debug Info ==="
          echo "Workflow Name: ${{ github.event.workflow_run.name }}"
          echo "Workflow Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow URL: ${{ github.event.workflow_run.html_url }}"
          echo "Secret exists: ${{ steps.check-secret.outputs.secret_exists }}"
          echo "=========================="

      - name: Send Discord notification
        if: steps.check-secret.outputs.secret_exists == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "=== Sending Discord Notification ==="
          echo "Webhook URL (first 50 chars): ${WEBHOOK_URL:0:50}..."
          
          # Get the payload from previous step safely using a heredoc
          # (prevents the shell from mis-parsing quotes/newlines inside JSON)
          PAYLOAD=$(cat <<'PAYLOAD_EOF'
${{ steps.payload.outputs.payload }}
PAYLOAD_EOF
)

          # Show a short payload preview for debugging (first 200 chars)
          echo "Payload preview: ${PAYLOAD:0:200}"
          
          # Validate payload
          if [ -z "$PAYLOAD" ]; then
            echo "❌ Payload is empty!"
            exit 1
          fi
          
          echo "Payload length: ${#PAYLOAD} characters"
          echo ""
          
          # Send the notification
          echo "Sending POST request to Discord webhook..."
          set +e  # Don't exit on error, we want to capture the response
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" 2>&1)
          CURL_EXIT=$?
          set -e
          
          if [ $CURL_EXIT -ne 0 ]; then
            echo "❌ curl command failed with exit code: $CURL_EXIT"
            echo "Response: $RESPONSE"
            exit 1
          fi
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 204 ] || [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Successfully sent notification to Discord!"
            if [ -n "$BODY" ]; then
              echo "Response: $BODY"
            fi
          elif [ "$HTTP_CODE" -eq 401 ] || [ "$HTTP_CODE" -eq 403 ]; then
            echo "❌ Authentication failed (HTTP $HTTP_CODE)"
            echo "Check that your webhook URL is correct and not expired"
            echo "Response: $BODY"
            exit 1
          elif [ "$HTTP_CODE" -eq 404 ]; then
            echo "❌ Webhook not found (HTTP $HTTP_CODE)"
            echo "The webhook URL might be invalid or the webhook was deleted"
            echo "Response: $BODY"
            exit 1
          else
            echo "❌ Failed to send notification (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Debug info (if notification fails)
        if: failure()
        run: |
          echo "=== Failure Debug Info ==="
          echo "Workflow Name: ${{ github.event.workflow_run.name }}"
          echo "Workflow Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Secret exists: ${{ steps.check-secret.outputs.secret_exists }}"
          echo "Check the 'Send Discord notification' step logs above for details"
          echo "=========================="

