name: Test Discord Notification

on:
  workflow_dispatch:

jobs:
  test-notification:
    name: Test Discord Webhook
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Discord webhook secret
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "❌ DISCORD_WEBHOOK_URL secret is not set!"
            echo ""
            echo "📝 How to set it up:"
            echo "1. Go to your GitHub repository"
            echo "2. Navigate to: Settings → Secrets and variables → Actions"
            echo "3. Click 'New repository secret'"
            echo "4. Name: DISCORD_WEBHOOK_URL (exactly as shown)"
            echo "5. Value: Paste your Discord webhook URL"
            echo "6. Click 'Add secret'"
            echo ""
            echo "🔗 To get your Discord webhook URL:"
            echo "1. Open your Discord server"
            echo "2. Server Settings → Integrations → Webhooks"
            echo "3. Create a new webhook or copy existing one"
            exit 1
          else
            echo "✅ Discord webhook secret found!"
            echo "Testing webhook connection..."
          fi

      - name: Test Discord webhook
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Sending test notification to Discord..."
          
          PAYLOAD=$(cat <<EOF
          {
            "username": "GitHub Actions Test",
            "embeds": [{
              "title": "🧪 Test Notification",
              "description": "This is a test notification from GitHub Actions.\n\nIf you see this message, your Discord webhook is configured correctly!",
              "color": 3066993,
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "footer": {
                "text": "GitHub Actions - Test"
              }
            }]
          }
          EOF
          )
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -eq 204 ] || [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Test notification sent successfully! (HTTP $HTTP_CODE)"
            echo "Check your Discord channel for the test message."
          else
            echo "❌ Failed to send test notification (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            echo ""
            echo "Troubleshooting:"
            echo "1. Verify the webhook URL is correct"
            echo "2. Check that the webhook is enabled in Discord"
            echo "3. Ensure the webhook channel exists and the bot has permissions"
            exit 1
          fi
