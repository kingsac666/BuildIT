name: "DISABLED - Backend CI (duplicate)"

# Disabled: this workflow was a duplicate of `ci.yml`.
# Keeping the file but disabling triggers so it won't run unintentionally.
on: []

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (optional)
        run: |
          echo "Add prettier/eslint check here if needed"
        continue-on-error: true

      - name: Verify server starts
        run: |
          timeout 10s npm start || true
        working-directory: packages/backend
        env:
          NODE_ENV: test
          PORT: 3001

